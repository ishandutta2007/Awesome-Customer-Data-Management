<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="auto" viewBox="0 0 1200 420" style="background:#0b0f19;border-radius:12px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#070a13"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#0b0f19"/></linearGradient><linearGradient id="titleGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="glowLineGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/><stop offset="50%" stop-color="#818cf8" stop-opacity=".8"/><stop offset="100%" stop-color="#c084fc" stop-opacity="0"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="30"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="pillShadow" width="120%" height="120%" x="-10%" y="-10%"><feDropShadow dx="0" dy="4" flood-color="#000" flood-opacity=".4" stdDeviation="6"/></filter></defs><style>@keyframes pulseOrb{0%{transform:scale(1) translate(0,0);opacity:.45}50%{transform:scale(1.15) translate(25px,-20px);opacity:.75}}@keyframes pulseOrbAlt{0%{transform:scale(1.1) translate(0,0);opacity:.35}50%{transform:scale(.95) translate(-30px,20px);opacity:.65}}@keyframes dataStream{0%{stroke-dashoffset:600}}@keyframes floatPill{0%{transform:translateY(0)}50%{transform:translateY(-5px)}}.orb-1{animation:pulseOrb 9s ease-in-out infinite;transform-origin:250px 180px}.orb-2{animation:pulseOrbAlt 11s ease-in-out infinite;transform-origin:950px 220px}.flow-line{stroke-dasharray:120 180;animation:dataStream 14s linear infinite}.flow-line-fast{stroke-dasharray:80 140;animation:dataStream 8s linear infinite reverse}.pill-group{animation:floatPill 6s ease-in-out infinite}</style><rect width="1200" height="420" fill="url(#bgGrad)"/><g stroke="#cbd5e1" stroke-width="1" opacity=".08"><line x1="0" x2="1200" y1="70" y2="70"/><line x1="0" x2="1200" y1="140" y2="140"/><line x1="0" x2="1200" y1="210" y2="210"/><line x1="0" x2="1200" y1="280" y2="280"/><line x1="0" x2="1200" y1="350" y2="350"/><line x1="150" x2="150" y1="0" y2="420"/><line x1="300" x2="300" y1="0" y2="420"/><line x1="450" x2="450" y1="0" y2="420"/><line x1="600" x2="600" y1="0" y2="420"/><line x1="750" x2="750" y1="0" y2="420"/><line x1="900" x2="900" y1="0" y2="420"/><line x1="1050" x2="1050" y1="0" y2="420"/></g><circle cx="220" cy="160" r="140" fill="#0284c7" class="orb-1" filter="url(#glow)" opacity=".45"/><circle cx="980" cy="240" r="160" fill="#7c3aed" class="orb-2" filter="url(#glow)" opacity=".4"/><circle cx="600" cy="80" r="100" fill="#3b82f6" class="orb-1" filter="url(#glow)" opacity=".25"/><path fill="none" stroke="url(#glowLineGrad)" stroke-width="2.5" d="M-50,320 C 300,260 400,380 750,300 C 1000,240 1150,340 1250,290" class="flow-line"/><path fill="none" stroke="url(#glowLineGrad)" stroke-width="1.8" d="M-50,110 C 250,180 500,60 800,140 C 1050,210 1150,120 1250,150" class="flow-line-fast"/><g opacity=".35"><circle cx="120" cy="90" r="4" fill="#38bdf8"/><circle cx="180" cy="340" r="3" fill="#818cf8"/><circle cx="1060" cy="90" r="4.5" fill="#c084fc"/><circle cx="1120" cy="330" r="3.5" fill="#38bdf8"/><line x1="120" x2="160" y1="90" y2="130" stroke="#38bdf8" stroke-dasharray="3 3" stroke-width="1"/><line x1="1060" x2="1020" y1="90" y2="130" stroke="#c084fc" stroke-dasharray="3 3" stroke-width="1"/></g><g text-anchor="middle" transform="translate(600, 75)"><rect width="270" height="34" x="-135" y="-17" fill="#1e293b" stroke="#334155" stroke-width="1.5" rx="17"/><circle cx="-110" cy="0" r="4" fill="#10b981"/><text x="5" y="5" fill="#94a3b8" font-size="12" font-weight="600" letter-spacing="1.2">CURATED ECOSYSTEM GUIDE</text></g><text x="600" y="165" fill="url(#titleGrad)" font-size="44" font-weight="800" letter-spacing="-.5" text-anchor="middle">Awesome Customer Data Management</text><text x="600" y="215" fill="#cbd5e1" font-size="18" font-weight="400" letter-spacing=".2" text-anchor="middle">Customer Data Platforms (CDP) • Identity Resolution • Reverse ETL • Open-Source Pipelines</text><text x="600" y="245" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="middle">Empowering data teams &amp; modern enterprises with open, privacy-first customer intelligence</text><g class="pill-group"><g transform="translate(600, 315) translate(-360, 0)"><rect width="170" height="36" x="-85" y="-18" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" filter="url(#pillShadow)" rx="18"/><text x="0" y="5" fill="#e0f2fe" font-size="13" font-weight="600" text-anchor="middle">⚡ Packaged &amp; Composable</text></g><g transform="translate(600, 315) translate(-120, 0)"><rect width="180" height="36" x="-90" y="-18" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" filter="url(#pillShadow)" rx="18"/><text x="0" y="5" fill="#ede9fe" font-size="13" font-weight="600" text-anchor="middle">🧩 Identity Graphs &amp; 360</text></g><g transform="translate(600, 315) translate(125, 0)"><rect width="190" height="36" x="-95" y="-18" fill="#1e293b" stroke="#c084fc" stroke-width="1.2" filter="url(#pillShadow)" rx="18"/><text x="0" y="5" fill="#fae8ff" font-size="13" font-weight="600" text-anchor="middle">🔄 Data Activation &amp; Sync</text></g><g transform="translate(600, 315) translate(360, 0)"><rect width="160" height="36" x="-80" y="-18" fill="#1e293b" stroke="#34d399" stroke-width="1.2" filter="url(#pillShadow)" rx="18"/><text x="0" y="5" fill="#d1fae5" font-size="13" font-weight="600" text-anchor="middle">🌟 100% Open Source</text></g></g><rect width="1200" height="4" x="0" y="416" fill="url(#titleGrad)"/></svg>