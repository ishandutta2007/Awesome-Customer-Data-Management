<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="auto" style="background:#0b0f19;border-radius:12px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="glowLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="pillShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <style>
    /* Dynamic floating particles & waves in background */
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.45; }
      50% { transform: scale(1.15) translate(25px, -20px); opacity: 0.75; }
    }
    @keyframes pulseOrbAlt {
      0%, 100% { transform: scale(1.1) translate(0px, 0px); opacity: 0.35; }
      50% { transform: scale(0.95) translate(-30px, 20px); opacity: 0.65; }
    }
    @keyframes dataStream {
      0% { stroke-dashoffset: 600; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }

    .orb-1 { animation: pulseOrb 9s ease-in-out infinite; transform-origin: 250px 180px; }
    .orb-2 { animation: pulseOrbAlt 11s ease-in-out infinite; transform-origin: 950px 220px; }
    .flow-line { stroke-dasharray: 120 180; animation: dataStream 14s linear infinite; }
    .flow-line-fast { stroke-dasharray: 80 140; animation: dataStream 8s linear infinite reverse; }
    .pill-group { animation: floatPill 6s ease-in-out infinite; }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Grid Pattern -->
  <g opacity="0.08" stroke="#cbd5e1" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Dynamic Glowing Orbs (Background layer) -->
  <circle cx="220" cy="160" r="140" fill="#0284c7" opacity="0.45" filter="url(#glow)" class="orb-1" />
  <circle cx="980" cy="240" r="160" fill="#7c3aed" opacity="0.4" filter="url(#glow)" class="orb-2" />
  <circle cx="600" cy="80" r="100" fill="#3b82f6" opacity="0.25" filter="url(#glow)" class="orb-1" />

  <!-- Animated Ambient Data Flow Lines (Background layer) -->
  <path d="M-50,320 C 300,260 400,380 750,300 C 1000,240 1150,340 1250,290" fill="none" stroke="url(#glowLineGrad)" stroke-width="2.5" class="flow-line" />
  <path d="M-50,110 C 250,180 500,60 800,140 C 1050,210 1150,120 1250,150" fill="none" stroke="url(#glowLineGrad)" stroke-width="1.8" class="flow-line-fast" />

  <!-- Decorative Network Nodes (Background layer) -->
  <g opacity="0.35">
    <circle cx="120" cy="90" r="4" fill="#38bdf8" />
    <circle cx="180" cy="340" r="3" fill="#818cf8" />
    <circle cx="1060" cy="90" r="4.5" fill="#c084fc" />
    <circle cx="1120" cy="330" r="3.5" fill="#38bdf8" />
    <line x1="120" y1="90" x2="160" y2="130" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3 3" />
    <line x1="1060" y1="90" x2="1020" y2="130" stroke="#c084fc" stroke-width="1" stroke-dasharray="3 3" />
  </g>

  <!-- FOREGROUND CONTENT: Header Tag, Title, Subtitle, Feature Pills -->
  
  <!-- Curated Collection Pill -->
  <g transform="translate(600, 75)" text-anchor="middle">
    <rect x="-135" y="-17" width="270" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="-110" cy="0" r="4" fill="#10b981" />
    <text x="5" y="5" fill="#94a3b8" font-size="12" font-weight="600" letter-spacing="1.2">CURATED ECOSYSTEM GUIDE</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="165" text-anchor="middle" font-size="44" font-weight="800" fill="url(#titleGrad)" letter-spacing="-0.5">
    Awesome Customer Data Management
  </text>

  <!-- Subtitle -->
  <text x="600" y="215" text-anchor="middle" font-size="18" font-weight="400" fill="#cbd5e1" letter-spacing="0.2">
    Customer Data Platforms (CDP) • Identity Resolution • Reverse ETL • Open-Source Pipelines
  </text>

  <text x="600" y="245" text-anchor="middle" font-size="14" font-weight="400" fill="#94a3b8">
    Empowering data teams &amp; modern enterprises with open, privacy-first customer intelligence
  </text>

  <!-- Feature Badges/Pills Row -->
  <g class="pill-group" transform="translate(600, 315)">
    <!-- Pill 1: CDPs & Master Data -->
    <g transform="translate(-360, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" filter="url(#pillShadow)" />
      <text x="0" y="5" text-anchor="middle" fill="#e0f2fe" font-size="13" font-weight="600">⚡ Packaged &amp; Composable</text>
    </g>

    <!-- Pill 2: Identity Resolution -->
    <g transform="translate(-120, 0)">
      <rect x="-90" y="-18" width="180" height="36" rx="18" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" filter="url(#pillShadow)" />
      <text x="0" y="5" text-anchor="middle" fill="#ede9fe" font-size="13" font-weight="600">🧩 Identity Graphs &amp; 360</text>
    </g>

    <!-- Pill 3: Reverse ETL -->
    <g transform="translate(125, 0)">
      <rect x="-95" y="-18" width="190" height="36" rx="18" fill="#1e293b" stroke="#c084fc" stroke-width="1.2" filter="url(#pillShadow)" />
      <text x="0" y="5" text-anchor="middle" fill="#fae8ff" font-size="13" font-weight="600">🔄 Data Activation &amp; Sync</text>
    </g>

    <!-- Pill 4: Open Source -->
    <g transform="translate(360, 0)">
      <rect x="-80" y="-18" width="160" height="36" rx="18" fill="#1e293b" stroke="#34d399" stroke-width="1.2" filter="url(#pillShadow)" />
      <text x="0" y="5" text-anchor="middle" fill="#d1fae5" font-size="13" font-weight="600">🌟 100% Open Source</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="0" y="416" width="1200" height="4" fill="url(#titleGrad)" />
</svg>
